<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smeagol Control</title><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="style.css"></head>
<body><header><div><b>SMEAGOL <span>CONTROL</span></b><small>LoRa FIELD TEST / v0.1</small></div><div id="connection">接続中…</div></header>
<main><section class="map-wrap"><div class="toolbar"><strong id="course-name">JRC2SR26 · Leg 1</strong><label class="kml-picker">KMLを読み込む<input id="kml-file" type="file" accept=".kml,application/vnd.google-earth.kml+xml"></label><button id="fit">コース全体</button><label><input id="tiles" type="checkbox">背景地図（通信使用）</label></div><div id="map"></div><div class="legend">● コース地点　━ SS / Liaison / ALT　　車両位置は最終受信点</div></section>
<aside><section><h2>受信モニター <span id="count">0</span></h2><p id="receiver"></p><div id="stats"></div><p class="muted">RSSI：未取得 · 欠落率：算出不可（連番なし）</p></section><section><h2>ログ</h2><div class="log-actions"><a class="download-button" href="/api/log/current.csv">走行ログCSV</a><a class="download-button secondary" href="/api/log/current-gaps.csv">通信断CSV</a></div><p class="muted">現在のサーバー起動セッションのログを保存します。</p></section><section><h2>VEHICLES</h2><div id="vehicles" class="muted">受信を待っています</div></section><section><h2>受信データ</h2><div id="details" class="muted">地図上の車両番号をクリック</div></section><section><h2>動作テスト</h2><button id="demo">疑似走行を開始</button><p class="muted">DEMOとして別記録。KMLの最初のSS上を移動します。</p><form id="packet-form"><label for="packet">手動パケット入力</label><textarea id="packet" rows="3">V001,35.245174,138.918307,1.0,8,0.00,0.00,0.00,0.00,0.0,OK</textarea><button>受信させる</button></form><p id="message" role="status"></p></section></aside></main>
<script src="vendor/leaflet.js"></script><script src="app.js"></script></body></html>
